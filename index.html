<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="咚咚的英语王国">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" type="image/png" href="icon.png">
  <title>咚咚的英语王国</title>
  <link rel="stylesheet" href="style.css">
  <script src="dict.js"></script>
</head>
<body>
<div id="app">

  <!-- ── 查词 ── -->
  <div id="tab-lookup" class="tab-page active">
    <header><h1>🔍 查词</h1></header>
    <div class="tab-body">
      <button id="mic-btn" class="mic-btn" aria-label="语音输入">🎤</button>
      <p id="voice-hint" class="voice-hint">点击按钮，朗读单词 🎵</p>

      <div class="search-row">
        <input id="word-input" type="text" placeholder="也可以输入单词…"
               autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">
        <button id="search-btn" class="icon-btn" aria-label="查询">🔎</button>
      </div>

      <div id="lookup-result"></div>
    </div>
  </div>

  <!-- ── 生词本 ── -->
  <div id="tab-notebook" class="tab-page">
    <header>
      <h1>📖 生词本</h1>
      <button id="add-btn" class="icon-btn" aria-label="手动添加">+</button>
    </header>
    <div class="tab-body">
      <input id="notebook-search" type="text" placeholder="🔍 搜一搜…" class="search-input">
      <div id="notebook-list"></div>
    </div>
  </div>

  <!-- ── 复习 ── -->
  <div id="tab-review" class="tab-page">
    <header><h1>🎯 复习</h1></header>
    <div class="tab-body" id="review-body"></div>
  </div>

  <!-- ── 听句子 ── -->
  <div id="tab-sentences" class="tab-page">
    <header>
      <h1>🎧 听句子</h1>
      <button id="add-sentence-btn" class="icon-btn" aria-label="添加句子">+</button>
    </header>
    <div class="tab-body" id="sentences-body"></div>
  </div>

  <!-- 底部标签栏 -->
  <nav id="tab-bar">
    <button class="tab-btn active" data-tab="lookup">
      <span class="tab-emoji">🔍</span>
      <span>查词</span>
    </button>
    <button class="tab-btn" data-tab="notebook">
      <span class="tab-emoji">📖</span>
      <span>生词本</span>
      <span id="notebook-badge" class="badge hidden"></span>
    </button>
    <button class="tab-btn" data-tab="review">
      <span class="tab-emoji">🎯</span>
      <span>复习</span>
      <span id="review-badge" class="badge hidden"></span>
    </button>
    <button class="tab-btn" data-tab="sentences">
      <span class="tab-emoji">🎧</span>
      <span>听句子</span>
    </button>
  </nav>
</div>

<!-- 手动添加弹窗 -->
<div id="add-modal" class="modal hidden">
  <div class="modal-card">
    <h2>✏️ 手动添加</h2>
    <input id="add-english" type="text" placeholder="英文单词"
           autocomplete="off" autocorrect="off" autocapitalize="none">
    <input id="add-chinese" type="text" placeholder="中文释义">
    <p id="add-error" class="error-msg hidden"></p>
    <div class="modal-row">
      <button id="auto-lookup-btn" class="btn-secondary">自动查询释义</button>
      <div style="flex:1"></div>
      <button id="cancel-add" class="btn-secondary">取消</button>
      <button id="confirm-add" class="btn-primary">添加</button>
    </div>
  </div>
</div>

<!-- 添加句子弹窗 -->
<div id="add-sentence-modal" class="modal hidden">
  <div class="modal-card">
    <h2>➕ 添加句子</h2>
    <input id="add-sentence-en" type="text" placeholder="英文句子"
           autocomplete="off" autocorrect="off" spellcheck="false">
    <input id="add-sentence-zh" type="text" placeholder="中文意思（可选）">
    <div class="modal-row">
      <div style="flex:1"></div>
      <button id="cancel-add-sentence" class="btn-secondary">取消</button>
      <button id="confirm-add-sentence" class="btn-primary">添加</button>
    </div>
  </div>
</div>

<!-- 编辑释义弹窗 -->
<div id="edit-modal" class="modal hidden">
  <div class="modal-card">
    <h2>✏️ 编辑释义</h2>
    <p id="edit-word-label" class="edit-word-label"></p>
    <textarea id="edit-chinese" rows="4" placeholder="中文释义…"></textarea>
    <div class="modal-row">
      <button id="cancel-edit" class="btn-secondary">取消</button>
      <button id="confirm-edit" class="btn-primary">保存</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
